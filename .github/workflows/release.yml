name: FrontendDeploy

on:
  push: 
    branches:
      - main 

jobs:

 build:
   name: build
   runs-on: ubuntu-latest

   steps:
     - uses: actions/checkout@v3

     - name: Setup
       uses: actions/setup-node@v2
       with:
          node-version: 20
          cache: 'npm'
     
     - name: Install
       run: npm install
     
     - name: Build
       run: npm run build
     
     - name: Upload new version
       uses: garygrossgarten/github-action-scp@release
       with:
         local: dist
         remote: /usr/share/nginx/dist
         host: ${{ secrets.HOST }}
         username: ${{ secrets.SSH_USER }}
         password: ${{ secrets.SSH_PASSWORD }}
